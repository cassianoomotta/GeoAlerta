name: Factory checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  factory-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install validation dependencies
        run: python -m pip install -r Factory/requirements-dev.txt
      - name: Run factory tests
        run: python -m unittest discover -s Factory/tests -v
      - name: Validate mission ledger
        run: python Factory/ledger/validate.py
